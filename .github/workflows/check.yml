name: Check
on:
  pull_request:
    branches: main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
  pull-requests: write
env:
  WORKING_DIRECTORY: "${{ github.workspace }}/terraform/aws/environments/mng/oidc"
jobs:
  check:
    runs-on: ubuntu-latest
    environment: mng
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Repository
        run: |
          echo "This repository"
          git branch
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.0
      - name: Init Terraform
        run: terraform init
        working-directory: ${{ env.WORKING_DIRECTORY }}
      - name: Format Terraform
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # - name: Setup TFLint
      #   uses: terraform-linters/setup-tflint@v4
      #   with:
      #     tflint_version: v0.52.0
      # - name: Show TFLint version
      #   run: tflint --version
      # - name: Init TFLint
      #   run: tflint --init --config ${{ github.workspace }}/terraform/.tflint.hcl
      # - name: Run TFLint
      #   run: tflint --recursive --format compact --config ${{ github.workspace }}/terraform/.tflint.hcl
      #   continue-on-error: true
      - name: Comment TFLint
        uses: reviewdog/action-tflint@master
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          tflint_init: true
          tflint_version: "v0.52.0"
          tflint_config: ${{ github.workspace }}/terraform/.tflint.hcl
          flags: "--recursive --format=checkstyle"
          fail_on_error: false

      - name: Run tfsec
        uses: tfsec/tfsec-pr-commenter-action@main
        with:
          working_directory: ${{env.WORKING_DIRECTORY}}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan Terraform
        run: terraform plan
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true
      - name: Comment PR
        uses: actions/github-script@v3
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `
            #### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan</summary>
            \`\`\`terraform${process.env.PLAN}\`\`\`
            </details>`;
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
